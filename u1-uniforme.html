<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniforme · Unidad 1 · Servicio de Alimentos y Bebidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bordeaux:#961329;
    --bordeaux-dark:#650D1C;
    --gold:#C9A15A;
    --linen:#F7EFCE;
    --linen-light:#FFFAE0;
    --ink:#26211C;
    --teal:#3F5D58;
    --teal-light:#E4EDEB;
    --ok:#3F5D58;
    --bad:#8C3B3B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--linen);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    line-height:1.65;
    padding-bottom:6rem;
  }
  a{color:inherit;}

  nav.topbar{
    background:var(--bordeaux-dark);
    color:var(--linen-light);
    padding:.9rem 1.5rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:.6rem;
    font-family:'Space Mono',monospace;
    font-size:.72rem;
    letter-spacing:.06em;
  }
  nav.topbar a.back{color:var(--gold);text-decoration:none;}
  nav.topbar a.back:hover{text-decoration:underline;}
  .crumb{opacity:.7;text-transform:uppercase;}

  header.hero{
    background:var(--bordeaux);
    color:var(--linen-light);
    padding:3.4rem 1.5rem 3rem;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute;
    inset:12px;
    border:1px solid rgba(201,161,90,0.4);
    pointer-events:none;
    z-index:3;
  }
  header.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at center, rgba(101,13,28,.35) 0%, rgba(101,13,28,.12) 55%, rgba(101,13,28,0) 85%);
    z-index:1;
    pointer-events:none;
  }
  .hero-bg-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:105%;max-width:560px;opacity:.4;filter:brightness(0) invert(1);pointer-events:none;z-index:0;}
  .hero-inner{position:relative;z-index:2;}
  .unit-tag{
    font-family:'Space Mono',monospace;
    font-size:.72rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:1.2rem;
  }
  h1.title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(2.2rem,5.5vw,3.6rem);
    letter-spacing:-.01em;
  }
  .subtitle{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:1.05rem;
    color:var(--gold);
    margin-top:.7rem;
  }

  main{max-width:800px;margin:0 auto;padding:3rem 1.5rem 1rem;}

  h2.section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.65rem;
    color:var(--bordeaux);
    margin:3.2rem 0 .6rem;
    display:flex;
    align-items:center;
    gap:.7rem;
  }
  h2.section-title .num{
    font-family:'Space Mono',monospace;
    font-size:.8rem;
    background:var(--bordeaux);
    color:var(--gold);
    padding:.25rem .55rem;
    border-radius:2px;
  }
  p{margin-bottom:1rem;font-size:1rem;}
  ul.plain{margin:0 0 1rem 1.2rem;}
  ul.plain li{margin-bottom:.45rem;}
  strong{color:var(--bordeaux);}

  .lead{
    font-size:1.08rem;
    border-left:3px solid var(--gold);
    padding-left:1.1rem;
    font-style:italic;
    color:var(--ink);
    opacity:.9;
    margin-bottom:1.5rem;
  }

  .grid-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:1rem;
    margin:1.2rem 0 1.5rem;
  }
  .fn-card{
    background:var(--linen-light);
    border:1px solid rgba(38,33,28,.12);
    border-top:3px solid var(--gold);
    padding:1.1rem 1rem;
    border-radius:3px;
  }
  .fn-card .fn-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    color:var(--bordeaux);
    margin-bottom:.35rem;
    font-size:1.02rem;
  }
  .fn-card p{font-size:.9rem;margin:0;opacity:.85;}

  .tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.4rem 0 0;}
  .tab-btn{
    font-family:'Space Mono',monospace;
    font-size:.75rem;
    letter-spacing:.03em;
    background:var(--linen-light);
    border:1px solid rgba(38,33,28,.2);
    color:var(--ink);
    padding:.55rem .9rem;
    border-radius:3px 3px 0 0;
    cursor:pointer;
    transition:.15s;
  }
  .tab-btn:hover{background:var(--teal-light);}
  .tab-btn.active{background:var(--bordeaux);color:var(--linen-light);border-color:var(--bordeaux);}
  .tab-panel{
    display:none;
    background:var(--linen-light);
    border:1px solid rgba(38,33,28,.15);
    padding:1.4rem 1.5rem;
    border-radius:0 3px 3px 3px;
  }
  .tab-panel.active{display:block;}
  .tab-panel ul{margin-left:1.2rem;}
  .tab-panel li{margin-bottom:.5rem;}

  .accordion-item{border-bottom:1px solid rgba(38,33,28,.15);}
  .accordion-head{
    width:100%;text-align:left;background:none;border:none;
    padding:1rem 0;font-family:'Fraunces',serif;font-weight:600;
    font-size:1.05rem;color:var(--ink);cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
  }
  .accordion-head:hover{color:var(--bordeaux);}
  .accordion-head .icon{font-family:'Space Mono',monospace;color:var(--gold);font-size:1.1rem;transition:transform .2s;}
  .accordion-item.open .icon{transform:rotate(45deg);}
  .accordion-body{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:.95rem;opacity:.9;}
  .accordion-item.open .accordion-body{max-height:400px;padding-bottom:1rem;}

  .checklist-box{
    background:var(--teal-light);
    border:1px solid rgba(63,93,88,.3);
    border-radius:4px;
    padding:1.5rem 1.5rem 1.2rem;
    margin:1.5rem 0;
  }
  .checklist-box .cl-title{font-family:'Fraunces',serif;font-weight:600;color:var(--teal);margin-bottom:.9rem;font-size:1.1rem;}
  .cl-item{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.7rem;cursor:pointer;font-size:.95rem;}
  .cl-item input{margin-top:.25rem;accent-color:var(--teal);width:16px;height:16px;flex-shrink:0;}
  .cl-item.checked span{text-decoration:line-through;opacity:.55;}
  .cl-progress{margin-top:1rem;font-family:'Space Mono',monospace;font-size:.75rem;color:var(--teal);}

  .quiz-box{
    background:var(--linen-light);
    border:1px solid rgba(38,33,28,.15);
    border-radius:4px;
    padding:1.6rem 1.6rem;
    margin:1.2rem 0;
  }
  .quiz-q{font-family:'Fraunces',serif;font-weight:600;margin-bottom:.9rem;font-size:1.05rem;}
  .quiz-opts{display:flex;flex-direction:column;gap:.55rem;margin-bottom:.6rem;}
  .quiz-opt{
    text-align:left;background:#fff;border:1px solid rgba(38,33,28,.2);
    padding:.7rem .9rem;border-radius:3px;cursor:pointer;
    font-family:'Work Sans',sans-serif;font-size:.92rem;transition:.15s;
  }
  .quiz-opt:hover{border-color:var(--bordeaux);}
  .quiz-opt.correct{background:var(--teal-light);border-color:var(--ok);color:var(--ok);font-weight:600;}
  .quiz-opt.incorrect{background:#F5E4E4;border-color:var(--bad);color:var(--bad);}
  .quiz-feedback{font-size:.85rem;font-style:italic;min-height:1.2rem;}


  .video-section{margin:3.2rem 0 1rem;}
  .video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.3rem;margin:1.3rem 0 1.5rem;}
  .video-card{background:var(--linen-light);border:1px solid rgba(38,33,28,.15);border-radius:8px;padding:1.1rem;text-align:center;}
  .video-card .vc-title{font-family:'Fraunces',serif;font-weight:600;color:var(--bordeaux);margin-bottom:.7rem;font-size:.95rem;}
  .video-card blockquote.tiktok-embed{margin:0 auto !important;}
  .menu-link-card{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
    background:var(--bordeaux);color:var(--linen-light);border-radius:8px;padding:1.3rem 1.5rem;margin:1.5rem 0;
  }
  .menu-link-card .mlc-text{font-size:.9rem;max-width:40ch;}
  .menu-link-card .mlc-text strong{display:block;font-family:'Fraunces',serif;font-size:1.05rem;color:var(--gold);margin-bottom:.2rem;}
  .menu-link-card a{
    font-family:'Space Mono',monospace;font-size:.78rem;background:var(--gold);color:var(--bordeaux-dark);
    padding:.6rem 1.1rem;border-radius:20px;text-decoration:none;font-weight:700;white-space:nowrap;
  }

  .page-nav{
    position:sticky;bottom:0;background:var(--bordeaux-dark);
    display:flex;justify-content:space-between;align-items:center;
    padding:.9rem 1.5rem;margin-top:4rem;
  }
  .page-nav a{
    font-family:'Space Mono',monospace;font-size:.75rem;color:var(--linen-light);
    text-decoration:none;padding:.55rem 1rem;border:1px solid rgba(237,230,214,.35);border-radius:3px;
  }
  .page-nav a:hover{background:rgba(201,161,90,.15);border-color:var(--gold);}
  .page-nav .disabled{opacity:.3;pointer-events:none;}

  footer.site-footer{
    text-align:center;padding:2rem 1.5rem 1rem;
    font-family:'Space Mono',monospace;font-size:.7rem;color:rgba(38,33,28,.5);
  }
</style>
</head>
